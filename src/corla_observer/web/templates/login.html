{% extends "base.html" %}
{% block title %}Coordinator login{% endblock %}
{% block main %}
<h1>Coordinator login</h1>
{% if error %}<p class="notice notice-error" role="alert"><span aria-hidden="true">&#9650;</span> {{ error }}</p>{% endif %}
<form method="post" action="{{ url('/login') }}" class="card form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Name <input name="name" autocomplete="username" required maxlength="64" autocapitalize="none" spellcheck="false"></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
  <button type="submit">Log in</button>
</form>
<p class="muted">Accounts are created on the server with <code>corla-observer user add NAME</code>.</p>
{% endblock %}
