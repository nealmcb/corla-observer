[project]
name = "corla-observer"
version = "0.1.0"
description = "Support for independent public observation of Colorado's risk-limiting audits"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pillow>=11",
    "python-multipart>=0.0.32",
    "reportlab>=5.1",
    "segno>=1.6.6",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
corla-observer = "corla_observer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "httpx>=0.28.1",
    "types-reportlab>=5.0.0.20261008",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corla_observer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not browser'"
markers = [
    "slow: acceptance tests on real public data from the audit center mirror, and the photo check printed end to end; run with `pytest -m slow`",
    "browser: tests that drive the observer page in a real browser (Chromium, with Playwright); run with `pytest -m browser`",
]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
